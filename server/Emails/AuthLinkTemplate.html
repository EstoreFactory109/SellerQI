<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            line-height: 1.6;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
            color: #ffffff;
            padding: 32px 24px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 400;
        }

        .header .subtitle {
            margin: 8px 0 0 0;
            font-size: 15px;
            opacity: 0.9;
        }

        .content {
            padding: 32px 28px;
            color: #1f2937;
        }

        .greeting {
            font-size: 17px;
            margin: 0 0 16px 0;
        }

        .intro {
            font-size: 15px;
            color: #4b5563;
            margin: 0 0 24px 0;
        }

        .details {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background-color: #f9fafb;
            padding: 4px 18px;
            margin: 0 0 26px 0;
        }

        .detail-row {
            display: block;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6b7280;
            margin: 0 0 2px 0;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: #111827;
            margin: 0;
            word-break: break-all;
        }

        .cta-wrapper {
            text-align: center;
            margin: 0 0 24px 0;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        .fallback {
            font-size: 13px;
            color: #6b7280;
            margin: 0 0 24px 0;
            word-break: break-all;
        }

        .fallback a {
            color: #2563eb;
        }

        .note {
            font-size: 13px;
            color: #6b7280;
            background-color: #f3f4f6;
            border-left: 3px solid #2563eb;
            padding: 12px 14px;
            border-radius: 4px;
            margin: 0;
        }

        .footer {
            background-color: #f9fafb;
            border-top: 1px solid #e5e7eb;
            padding: 20px 24px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>{{title}}</h1>
            <p class="subtitle">{{subtitle}}</p>
        </div>

        <div class="content">
            <p class="greeting">Hi,</p>
            <p class="intro">{{intro}}</p>

            <div class="cta-wrapper">
                <a href="{{link}}" class="cta-button">{{buttonLabel}}</a>
            </div>

            <p class="fallback">
                If the button does not work, copy and paste this link into your browser:<br>
                <a href="{{link}}">{{link}}</a>
            </p>

            <p class="note">{{note}}</p>
        </div>

        <div class="footer">
            <p style="margin:0 0 6px 0;">Sent by {{appName}}</p>
            <p style="margin:0;">Need help? Contact us at <a href="mailto:support@sellerqi.com">support@sellerqi.com</a></p>
        </div>
    </div>
</body>
</html>
